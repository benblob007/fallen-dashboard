<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Fallen{% endblock %} — ✝ The Fallen ✝</title>
    <link rel="icon" href="/static/fallen-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand"><img src="/static/fallen-logo.png" alt="Logo" class="nav-logo"> The Fallen</a>
        <div class="nav-links">
            <a href="/leaderboard" class="nav-link">Leaderboard</a>
            <a href="/raids" class="nav-link">Raids</a>
            <a href="/duels" class="nav-link">Duels</a>
            <a href="/economy" class="nav-link">Economy</a>
            <a href="/clan" class="nav-link">Clan</a>
            {% if user %}
                <a href="/profile" class="nav-link">Profile</a>
                <a href="/customize" class="nav-link">Customize</a>
                {% if is_staff %}<a href="/staff" class="nav-link nav-staff">Staff</a>{% endif %}
                <div class="nav-user">
                    <img src="{{ user.avatar }}" class="nav-avatar" alt="">
                    <span class="nav-username">{{ user.username }}</span>
                    <a href="/auth/logout" class="nav-link nav-logout">Logout</a>
                </div>
            {% else %}
                <a href="/auth/login" class="btn btn-sm nav-login">Login with Discord</a>
            {% endif %}
        </div>
        <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    </nav>
    <main class="main-content">{% block content %}{% endblock %}</main>
    <footer class="footer"><p>✝ The Fallen ✝ — Est. 2024</p></footer>
    {% block scripts %}{% endblock %}
</body>
</html>
